services:
  myrargb:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - CHROME_URL=http://browser:4444
      - LOGGER_LEVEL=ERROR
      - HTTP_PROXY=http://172.17.0.1:10808
      - HTTPS_PROXY=http://172.17.0.1:10808
      - NVIDIA_VISIBLE_DEVICES=all
      # Cap glibc malloc arenas: 7 consumer threads otherwise each hold an
      # arena, and freed heap parks in them as retained RSS (seen ~4GiB
      # after a backlog drain, 2026-07-02).
      - MALLOC_ARENA_MAX=2
    volumes:
      - ./data:/app/data
    runtime: nvidia
    depends_on:
      - kafka
      

  kafka:
    image: apache/kafka:4.3.0-rc1
    hostname: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9200:9200"
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      # The image defaults to -Xms1G -Xmx1G, and the broker ends up holding
      # ~1GiB RSS for a handful of messages a day. Its live heap is ~185MB
      # (mostly the 128MB log-cleaner buffer), so 384m leaves ample headroom.
      KAFKA_HEAP_OPTS: -Xms128m -Xmx384m
      # Default log dir is /tmp/kafka-logs in the container's writable layer:
      # topics and committed offsets vanish whenever the container is recreated.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      TZ: Asia/Shanghai


  kafka-ui:
    image: provectuslabs/kafka-ui
    ports:
      - "9090:8080"
    depends_on:
      - kafka
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:9092
      - TZ=Asia/Shanghai

volumes:
  kafka-data:

